<html lang="fr">
<head>
<meta charset="utf-8">

<title>Perfect CLEAN & STAY — Web</title>
<style>
:root{
  --bg:#eef2f7;--card:#fff;--text:#111827;--muted:#64748b;--line:#d8dee8;
  --accent:#0f172a;--accent2:#1e3a8a;--soft:#f8fafc;--danger:#991b1b;--ok:#166534;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#0f172a,#1e3a8a);color:white;padding:12px 14px;box-shadow:0 2px 10px #0002}
h1{font-size:19px;margin:0 0 6px}h2{font-size:17px;margin:0}h3{font-size:15px;margin:10px 0 6px}
main{max-width:950px;margin:auto;padding:12px}
.card,.section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0;box-shadow:0 1px 5px #0000000a}
input,select,textarea,button{font:inherit;width:100%;border:1px solid #a8b0bd;border-radius:10px;padding:10px;background:white;color:var(--text)}
textarea{min-height:76px;resize:vertical}
button{cursor:pointer;background:var(--accent);color:white;border-color:var(--accent);font-weight:700}
button.secondary{background:white;color:var(--accent)}
button.blue{background:var(--accent2);border-color:var(--accent2)}
button.danger{background:var(--danger);border-color:var(--danger)}
button.small{width:auto;padding:7px 9px;font-size:12px}
button.ghost{background:#f8fafc;color:#111827;border-color:#cbd5e1}
label{display:block;font-weight:700;font-size:13px;margin:8px 0 4px}
.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}
.topline,.titlebar,.result,.itemhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.nav{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.nav button{min-height:48px}
.result{border-top:1px solid var(--line);padding:9px 0}
.item{border:1px solid var(--line);border-radius:12px;padding:9px;margin:8px 0;background:var(--soft)}
.item-actions{display:flex;gap:5px;flex-wrap:wrap}
.item-actions button{width:auto}
.item img,.preview{max-width:100%;max-height:180px;border-radius:9px;margin-top:7px}
.item video{max-width:100%;max-height:220px;margin-top:7px}
.badge{display:inline-block;border-radius:999px;background:#e2e8f0;padding:3px 8px;font-size:12px}
.empty{padding:12px;color:var(--muted);font-style:italic}
.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:10px;z-index:60;max-width:90%;text-align:center}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.sticky-actions{position:sticky;bottom:8px;z-index:10;background:#ffffffee;backdrop-filter:blur(6px);padding:8px;border:1px solid var(--line);border-radius:12px}
.kicker{font-weight:800;font-size:12px;letter-spacing:.04em;color:#475569;text-transform:uppercase}
@media(max-width:560px){
  .row,.row3{grid-template-columns:1fr}
  .nav{grid-template-columns:1fr 1fr}
  h1{font-size:16px}
  .titlebar{align-items:flex-start}
}

.theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0}
.theme-card{border:0;border-radius:18px;padding:18px 12px;min-height:105px;color:white;text-align:left;box-shadow:0 5px 14px #0002;display:flex;flex-direction:column;justify-content:space-between}
.theme-card .ico{font-size:28px;line-height:1}
.theme-card .txt{font-size:15px;font-weight:800;letter-spacing:.01em}
.theme-card .sub{font-size:11px;font-weight:600;opacity:.9;margin-top:3px}
.t-blue{background:linear-gradient(135deg,#2563eb,#1d4ed8)}
.t-orange{background:linear-gradient(135deg,#f59e0b,#d97706)}
.t-green{background:linear-gradient(135deg,#16a34a,#15803d)}
.t-purple{background:linear-gradient(135deg,#7c3aed,#6d28d9)}
.t-pink{background:linear-gradient(135deg,#db2777,#be185d)}
.t-red{background:linear-gradient(135deg,#dc2626,#b91c1c)}
.t-cyan{background:linear-gradient(135deg,#0891b2,#0e7490)}
.t-slate{background:linear-gradient(135deg,#475569,#334155)}
.cat-maintenance{border-left:5px solid #f59e0b}
.cat-runner{border-left:5px solid #2563eb}
.cat-cleaning{border-left:5px solid #16a34a}
.cat-taches{border-left:5px solid #a16207}
.cat-manquants{border-left:5px solid #dc2626}
.cat-abimes{border-left:5px solid #7c3aed}
.cat-objets{border-left:5px solid #0891b2}
.cat-equipements{border-left:5px solid #475569}
.cat-title{display:flex;align-items:center;gap:8px}
.cat-title .emoji{font-size:22px}
@media(max-width:400px){.theme-grid{gap:9px}.theme-card{min-height:95px;padding:15px 10px}}


.inline-add{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:10px}
.inline-add button{width:auto;min-width:82px}
.three-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}
.three-actions button{width:100%;padding:8px 5px;font-size:11px}
@media(max-width:390px){.three-actions{grid-template-columns:1fr 1fr 1fr}.three-actions button{font-size:10px;padding:8px 3px}}


.media-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:9px}
.media-box{position:relative;border:1px solid #d1d5db;border-radius:10px;overflow:hidden;background:#fff;min-height:80px}
.media-box img,.media-box video{display:block;width:100%;max-height:220px;object-fit:cover;margin:0;border-radius:0}
.media-remove{position:absolute;top:5px;right:5px;width:30px;height:30px;border-radius:999px;padding:0;background:#991b1b;color:white;border:2px solid white;font-size:20px;line-height:24px}
@media(max-width:390px){.media-grid{grid-template-columns:1fr 1fr}}


/* Médias toujours en couleur */
.item img,
.item video,
.preview,
.media-box img,
.media-box video{
  filter:none !important;
  -webkit-filter:none !important;
  opacity:1 !important;
  mix-blend-mode:normal !important;
  background:#fff !important;
}


.inline-add{margin-top:8px;margin-bottom:10px}
.inline-add + [id^="items_"]{margin-top:0}


.media-help{font-size:12px;color:#64748b;margin-top:5px}


.equipment-note{margin-top:9px}
.equipment-note label{font-size:12px;margin-bottom:4px}
.equipment-note input{background:#f8fafc;border:1px solid #cbd5e1}


.equipment-check{display:flex;align-items:center;gap:8px;font-weight:700;margin:6px 0}
.equipment-check input{width:auto;transform:scale(1.2)}


.recap-head{background:#f8fafc;border:1px solid #dbe2ea;border-radius:12px;padding:10px;margin-bottom:12px}
.recap-head div{margin:3px 0}


.recap-apartment{font-weight:800;font-size:17px;margin:4px 0 9px}


.recap-category-title{
  display:block;
  margin:14px 0 8px;
  padding:8px 10px;
  border:1px solid #94a3b8;
  border-left:5px solid #1e3a8a;
  border-radius:8px;
  background:#f8fafc;
  font-weight:900;
  letter-spacing:.02em;
}
.recap-subcategory-title{
  margin:10px 0 5px;
  font-weight:800;
  text-decoration:underline;
}


.marriott-line{padding:10px 0;border-bottom:1px solid #e2e8f0}
.marriott-item{margin-bottom:6px}
.marriott-observation input{margin-bottom:0}


.theme-card .ico{
  display:inline-flex;
  align-items:center;
  min-height:34px;
  text-shadow:0 2px 4px #0002;
}
.theme-card .txt{font-size:16px}
.theme-card .sub{font-size:12px;line-height:1.25}

</style>
<style id="final-branding">
.final-logo-wrap{display:flex;justify-content:center;padding:16px 12px 6px}.final-logo{width:min(58vw,220px);height:auto;border-radius:50%;box-shadow:0 12px 34px rgba(0,0,0,.22)}
</style>

function blankReport(aid){
  const cats={};
  CATS.forEach(c=>cats[c]=[]);
  return {
    id:uid(),
    aptId:aid||"",
    arrival:"",
    pax:"",
    nights:"",
    cleaner:"",

    finalDesc:"",
    finalPhotos:[],
    finalVideo:"",
    keys:"",
    keysMedia:[],
    status:"in_progress",
    provisional:false,
    preparedAt:"",
    finalizedAt:""
  };
}

function normalizeReport(raw,aid){
  const base=blankReport(aid||raw?.aptId||"");
  const src=(raw&&typeof raw==="object")?raw:{};

  Object.assign(base,src);
  base.aptId=aid||src.aptId||base.aptId;

  // Toujours garantir toutes les catégories et listes.
  const srcCats=(src.cats&&typeof src.cats==="object")?src.cats:{};
  base.cats={};
  CATS.forEach(c=>{
    const arr=Array.isArray(srcCats[c])?srcCats[c]:[];
    const seenItems=new Set();
    base.cats[c]=arr.map(x=>({
      ...(x||{}),
      id:x?.id||uid(),
      // V35 : les items relus depuis Supabase portent item_text/text.
      // On normalise toujours le vrai titre dans name pour éviter « Sans nom ».
      name:csLocalItemText(x),
      precision:x?.precision||"",
      sub:x?.sub||x?.subcategory||"",
      media:Array.isArray(x?.media)?x.media:[],
      includeRecap:!!x?.includeRecap,
      fixedEquipment:!!x?.fixedEquipment
    })).filter(x=>{
      // V46 : un même enregistrement pouvait être relu deux fois depuis Supabase
      // et apparaître en double dans la récap. On dédouble uniquement la même
      // catégorie + même sous-catégorie + même titre. Un même titre dans deux
      // sous-catégories différentes reste donc autorisé.
      const title=csLocalItemText(x).trim().toLowerCase();
      if(!title)return false;
      const sub=String(x.sub||x.subcategory||"").trim().toLowerCase();
      const key=c+"|"+sub+"|"+title;
      if(seenItems.has(key))return false;
      seenItems.add(key);
      return true;
    });
  });

  // V35 : dédoublonnage des équipements. Les équipements standards ne doivent
  // apparaître qu'une seule fois, même après plusieurs ouvertures/synchronisations.
  const eqNames=["wi-fi","climatiseur","ventilateur","radiateur","lit bébé"];
  const seenEq=new Set();
  base.cats["ÉQUIPEMENTS"]=(base.cats["ÉQUIPEMENTS"]||[]).filter(x=>{
    const key=csLocalItemText(x).trim().toLowerCase();
    if(!key)return false;
    if(seenEq.has(key))return false;
    seenEq.add(key);
    if(eqNames.includes(key))x.fixedEquipment=true;
    return true;
  });

  if(!Array.isArray(base.finalPhotos))base.finalPhotos=[];
  if(!Array.isArray(base.keysMedia))base.keysMedia=[];
  if(typeof base.finalVideo!=="string")base.finalVideo=base.finalVideo||"";
  if(typeof base.finalDesc!=="string")base.finalDesc=base.finalDesc||"";
  if(typeof base.keys!=="string")base.keys=base.keys||"";
  if(!base.status)base.status=base.provisional?"draft":"in_progress";
  base.provisional=base.status==="draft"||base.provisional===true;

  return base;
}

async function deleteApartmentCompletely(aid){
  const a=(state.apartments||[]).find(x=>x.id===aid); if(!a)return;
  if(!confirm(`Supprimer définitivement "${a.name}" ?`))return;
  try{
    if(a._db&&isDbUuid(aid)){
      const {error}=await csSupabase.from("apartments").delete().eq("id",aid);
      if(error){alert("Suppression impossible : "+error.message);return;}
    }
  }catch(e){alert("Suppression impossible : "+(e?.message||e));return;}
  state.apartments=(state.apartments||[]).filter(x=>x.id!==aid);
  state.reports=(state.reports||[]).filter(r=>r.apartmentId!==aid&&r.aptId!==aid);
  if(state.inventories)delete state.inventories[aid];
  try{save()}catch(e){try{saveLocalOnly()}catch(_){}}

function csItemsForDb(r, reportId){
  const rows=[];
  let n=0;
  const cats=r.cats||{};
  Object.keys(cats).forEach(cat=>{
    const seen=new Set();
    (cats[cat]||[]).forEach(x=>{
      const t=csLocalItemText(x);
      if(!t)return;

      // V35 : les équipements standards sont des choix d'interface.
      // On ne les enregistre dans report_items que si l'utilisatrice les a
      // réellement renseignés/sélectionnés pour la récap.
      if(cat==="ÉQUIPEMENTS" && x.fixedEquipment && !x.includeRecap && !String(x.precision||"").trim())return;

      // Empêcher toute accumulation du même item dans un même rapport.
      const key=String(cat)+"|"+String(x.subcategory||x.sub||"")+"|"+t.toLowerCase();
      if(seen.has(key))return;
      seen.add(key);

      let dbSub=(x.subcategory || x.sub || null);
      if(cat==="ÉQUIPEMENTS"){
        dbSub="__PCS_EQ__"+JSON.stringify({
          precision:String(x.precision||""),
          includeRecap:!!x.includeRecap,
          fixedEquipment:!!x.fixedEquipment
        });
      }
      rows.push({
        report_id:reportId,
        category:String(cat),
        subcategory:dbSub,
        item_text:t,
        sort_order:n++
      });
    });
  });
  return rows;
}

async function csReplaceReportItems(r, reportId){
  // V35 : ne jamais insérer des items avec un report_id orphelin.
  // Cela corrige l'erreur report_items_report_id_fkey observée sur le terrain.
  const chk=await csSupabase.from("reports").select("id").eq("id",reportId).maybeSingle();
  if(chk.error)throw chk.error;
  if(!chk.data)throw new Error("Rapport Supabase introuvable avant sauvegarde des items");

  const {error:de}=await csSupabase.from("report_items").delete().eq("report_id",reportId);
  if(de)throw de;
  const rows=csItemsForDb(r,reportId);
  if(rows.length){
    const {error}=await csSupabase.from("report_items").insert(rows);
    if(error)throw error;
  }
}

async function loadCompanyData(){
  try{
    await csCleanupExpiredMedia();
    const localApartments=JSON.parse(JSON.stringify(state.apartments||[]));
    const localReports=JSON.parse(JSON.stringify(state.reports||[]));

    let ares=await csSupabase.from("apartments").select("*").order("created_at",{ascending:false});
    let rres=await csSupabase.from("reports").select("*").order("created_at",{ascending:false});
    let ires=await csSupabase.from("report_items").select("*").order("sort_order",{ascending:true});
    if(ares.error)throw ares.error;
    if(rres.error)throw rres.error;
    if(ires.error)throw ires.error;

    let apts=ares.data||[], rows=rres.data||[], items=ires.data||[];

    // Première connexion : envoyer les logements déjà présents sur le téléphone.
    if(apts.length===0 && localApartments.length){
      for(const a of localApartments){
        try{await csEnsureApartment(a)}catch(e){console.warn("Migration logement",e.message||e)}
      }
      ares=await csSupabase.from("apartments").select("*").order("created_at",{ascending:false});
      if(ares.error)throw ares.error;
      apts=ares.data||[];
    }

    // Première connexion : envoyer les rapports locaux en TEXTE uniquement.
    if(rows.length===0 && localReports.length){
      for(const old of localReports){
        try{
          const oldA=localApartments.find(a=>a.id===old.aptId);
          if(!oldA)continue;
          const remoteApt=await csEnsureApartment(oldA);
          const ins=await csSupabase.from("reports")
            .insert(csLocalReportToDb(old,remoteApt.id))
            .select("*").single();
          if(ins.error)throw ins.error;
          await csReplaceReportItems(old,ins.data.id);
        }catch(e){
          console.warn("Migration rapport",e.message||e);
        }
      }
      rres=await csSupabase.from("reports").select("*").order("created_at",{ascending:false});
      ires=await csSupabase.from("report_items").select("*").order("sort_order",{ascending:true});
      if(rres.error)throw rres.error;
      if(ires.error)throw ires.error;
      rows=rres.data||[];
      items=ires.data||[];
    }

    state.apartments=apts.map(a=>({
      id:a.id,
      name:a.name||a.reference,
      ref:a.reference,
      reference:a.reference,
      arrival:"",
      cleaning:"",
      status:a.is_active===false?"Inactif":"Libre"
    }));

    const byReport={};
    const seenDbItems={};
    items.forEach(it=>{
      const rid=String(it.report_id||"");
      const cat=String(it.category||"");
      const sub=String(it.subcategory||"");
      const txt=String(it.item_text||"").trim().toLowerCase();
      const key=cat+"|"+sub+"|"+txt;
      (seenDbItems[rid] ||= new Set());
      if(seenDbItems[rid].has(key))return;
      seenDbItems[rid].add(key);
      (byReport[rid] ||= []).push(it);
    });

    const mapped=rows.map(row=>{
      const base=normalizeReport({},row.apartment_id);
      base.id=row.id;
      base.aptId=row.apartment_id;
      base.verificationDate=row.report_date||String(row.created_at||"").slice(0,10);
      base.date=base.verificationDate;
      base.agent=row.agent||"";
      base.cleaner=row.cleaning_agent||"";
      base.cleaningDate=row.cleaning_date||"";
      base.agentScore=row.agent_rating==null?"":String(row.agent_rating);
      base.quality=row.cleaning_quality||"";
      base.arrival=row.arrival_date||"";
      base.pax=row.pax==null?"":row.pax;
      base.nights=row.nights==null?"":row.nights;
      base.cats=base.cats||{};

      (byReport[row.id]||[]).forEach(it=>{
        if(!base.cats[it.category])base.cats[it.category]=[];
        let sub=it.subcategory||"";
        let precision="";
        let includeRecap=false;
        let fixedEquipment=false;
        if(it.category==="ÉQUIPEMENTS" && typeof sub==="string" && sub.startsWith("__PCS_EQ__")){
          try{
            const eq=JSON.parse(sub.slice("__PCS_EQ__".length));
            precision=String(eq.precision||"");
            includeRecap=!!eq.includeRecap;
            fixedEquipment=!!eq.fixedEquipment;
            sub="";
          }catch(e){console.warn("Équipement ancien format",e)}
        }
        base.cats[it.category].push({
          id:uid(),
          name:it.item_text,
          text:it.item_text,
          sub,
          subcategory:sub,
          precision,
          includeRecap,
          fixedEquipment,
          media:[]
        });
      });

      base.finalRecap=row.final_recap||"";
      base.finalDesc="";
      base.finalPhotos=[];
      base.finalVideo="";
      base.keys="";
      base.keysMedia=[];
      base._db=true;
      base._createdAt=row.created_at;
      return base;
    });

    state.reports=mapped;
    state.reportHistory=mapped.map(r=>({
      ...JSON.parse(JSON.stringify(r)),
      historyId:r.id,
      savedDate:r.verificationDate||r.date||""
    }));
    csDbReady=true;
    saveLocalOnly();
  }catch(e){
    console.error("Chargement Supabase",e);
    toast("Impossible de charger la base : "+(e.message||e));
  }
}

function saveLocalOnly(){
  // Ne jamais saturer la mémoire du téléphone avec les photos/vidéos en base64.
  // La version complète du rapport reste synchronisée avec Supabase.
  try{
    const light=JSON.parse(JSON.stringify(state));

    (light.reports||[]).forEach(r=>{
      if(r.cats){
        Object.values(r.cats).forEach(arr=>{
          (arr||[]).forEach(x=>{
            if(Array.isArray(x.media)){
              x.media=x.media.map(m=>({
                id:m.id,
                type:m.type,
                name:m.name||"",
                // On ne garde pas le gros contenu base64 dans localStorage.
                data:""
              }));
            }
            if(x.photo)x.photo="";
            if(x.video)x.video="";
          });
        });
      }
      if(Array.isArray(r.finalPhotos))r.finalPhotos=[];
      if(r.finalVideo)r.finalVideo="";
      if(Array.isArray(r.keysMedia)){
        r.keysMedia=r.keysMedia.map(m=>({
          id:m.id,type:m.type,name:m.name||"",data:""
        }));
      }
    });

    localStorage.setItem(KEY,JSON.stringify(light));
  }catch(e){
    console.warn("Sauvegarde locale allégée impossible",e);
    // Ne jamais bloquer l'ajout d'un item pour une erreur de stockage local.
  }
}

async function csUploadSelectedCategoryMedia(r){

  }catch(e){console.warn("Session média",e);return}
  const token=session?.access_token||"";
  if(!token)return;

      }
    });
  });
}

async function csCleanupExpiredMedia(){
  try{
    const now=new Date().toISOString();
    const {data,error}=await csSupabase.from("media")
      .select("id,storage_bucket,storage_path")
      .eq("keep_permanently",false)
      .lt("expires_at",now);
    if(error)throw error;
    if(!data || !data.length)return;

    const groups={};
    data.forEach(x=>{(groups[x.storage_bucket] ||= []).push(x.storage_path)});
    for(const bucket of Object.keys(groups)){
      const del=await csSupabase.storage.from(bucket).remove(groups[bucket]);
      if(del.error)throw del.error;
    }
    const ids=data.map(x=>x.id);
    const rem=await csSupabase.from("media").delete().in("id",ids);
    if(rem.error)throw rem.error;
  }catch(e){console.warn("Nettoyage médias expirés",e?.message||e)}
}

async function csInsertReport(r){
  const {data:{user}}=await csSupabase.auth.getUser();
  if(!user)throw new Error("Session expirée");

  let apartmentId=r.aptId;
  if(!isDbUuid(apartmentId)){
    const a=(state.apartments||[]).find(x=>x.id===r.aptId);
    const remote=await csEnsureApartment(a||{name:r.aptId,ref:r.aptId});
    apartmentId=remote.id;
    if(a){
      const old=a.id;
      a.id=remote.id;
      a.ref=remote.reference;
      a.reference=remote.reference;
      (state.reports||[]).forEach(x=>{if(x.aptId===old)x.aptId=remote.id});
    }
    r.aptId=apartmentId;
  }

  const ins=await csSupabase.from("reports")
    .insert(csLocalReportToDb(r,apartmentId))
    .select("*").single();
  if(ins.error)throw ins.error;

  const old=r.id;
  r.id=ins.data.id;
  // Android conserve les URI par identifiant d'input. Lors du premier enregistrement,
  // le rapport passe d'un ID local à l'UUID Supabase : on transfère donc les sélections
  // vers les nouveaux IDs avant l'upload, sinon selectedCount() retourne 0.
  if(window.NativeShare && typeof NativeShare.rebindInput==="function") {
    try {
      Object.keys(r.cats||{}).forEach(cat=>{
        (r.cats[cat]||[]).forEach(item=>{
          if(!item||!item.id)return;
          NativeShare.rebindInput(`media_${old}_${item.id}`,`media_${r.id}_${item.id}`);
        });
      });
      NativeShare.rebindInput(`final_photos_${old}`,`final_photos_${r.id}`);
      NativeShare.rebindInput(`final_video_${old}`,`final_video_${r.id}`);
      NativeShare.rebindInput(`keys_media_${old}`,`keys_media_${r.id}`);
    } catch(e) { console.warn("Transfert médias vers UUID",e); }
  }
  r._db=true;
  r._createdAt=ins.data.created_at;
  if(state.activeReportId===old)state.activeReportId=r.id;

  await csReplaceReportItems(r,r.id);
  saveLocalOnly();
  csUploadSelectedCategoryMedia(r);
  return r;
}

async function csUpdateReport(r){
  if(!r)return r;

  // V35 : si le rapport local n'existe pas encore réellement dans Supabase,
  // le créer avant tout enregistrement des items (évite la FK orpheline).
  if(!isDbUuid(r.id)||!r._db)return await csInsertReport(r);

  const up=await csSupabase.from("reports")
    .update(csLocalReportToDb(r,r.aptId))
    .eq("id",r.id)
    .select("id")
    .maybeSingle();
  if(up.error)throw up.error;

  // UUID local connu mais ligne distante absente : recréer proprement le rapport.
  if(!up.data){
    r._db=false;
    return await csInsertReport(r);
  }

  await csReplaceReportItems(r,r.id);
  csUploadSelectedCategoryMedia(r);
  csForceUploadAllCategoryMedia(r);
  return r;
}

async function csGovCall(payload){
  const {data:{session}}=await csSupabase.auth.getSession();
    if(session?.user)rememberAdminIdentity(session.user);
  if(!session) throw new Error("Session expirée");
  const res=await fetch(CS_SUPABASE_URL+"/functions/v1/manage-governantes",{
    method:"POST",
    headers:{
      "Authorization":"Bearer "+session.access_token,
      "Content-Type":"application/json",
      "apikey":CS_SUPABASE_ANON
    },
    body:JSON.stringify(payload)
  });
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||"Erreur serveur");
  return data;
}

    const found=await csSupabase.from("apartments")
      .select("*").eq("reference",name).maybeSingle();

        ref:remote.reference,
        reference:remote.reference,
        arrival:"",
        cleaning:"",
        status:remote.is_active===false?"Inactif":"Libre"
      });

async function openApt(aid){
  const a=state.apartments.find(x=>x.id===aid);
  if(!a){toast('Logement introuvable');return}

  const reports=state.reports
    .filter(r=>r.aptId===aid)
    .slice()
    .sort((x,y)=>String(y._createdAt||y.preparedAt||y.verificationDate||y.date||'')
      .localeCompare(String(x._createdAt||x.preparedAt||x.verificationDate||x.date||'')));

  // Priorité absolue au rapport provisoire : on le reprend tel quel.
  const draft=reports.find(r=>r.status==='draft'||r.provisional===true);
  if(draft){
    state.activeReportId=draft.id;
    saveLocalOnly();
    editReport(draft.id);
    window.scrollTo({top:document.getElementById('view').offsetTop-10,behavior:'smooth'});
    toast('Rapport provisoire retrouvé. Tu peux continuer la vérification.');
    return;
  }

  const latest=reports.find(r=>r.status!=='draft');
  const today=new Date().toISOString().slice(0,10);
  const mineToday=reports.find(r=>
    (r.verificationDate||r.date)===today &&
    r._createdBy===current()?.supabaseId &&
    r.status!=='final'
  );

  if(mineToday){
    editReport(mineToday.id);
    return;
  }
  if(latest){
    // V37 : si la dernière vérification a été enregistrée aujourd'hui, on la rouvre
    // au lieu de créer immédiatement une copie. Les URI Android restent ainsi liées
    // au même report_id et les boutons WhatsApp continuent d'envoyer texte + médias.
    // Une nouvelle vérification n'est créée automatiquement que si le dernier rapport
    // appartient à un jour précédent.
    const latestDay=String(latest.verificationDate||latest.date||latest.finalizedAt||latest._createdAt||'').slice(0,10);
    if(latestDay===today){
      state.activeReportId=latest.id;
      saveLocalOnly();
      editReport(latest.id);
      toast('Dernière vérification du jour rouverte. Les photos et vidéos restent disponibles pour WhatsApp.');
      return;
    }
    await newVerificationFromLatest(aid,latest.id);
    return;
  }
  await newReportForApartment(aid);
}

function getR(rid){
  const ix=state.reports.findIndex(r=>r.id===rid);
  if(ix<0)return null;
  const original=state.reports[ix];
  const normalized=normalizeReport(original,original.aptId);
  // conserver les métadonnées DB
  normalized.id=original.id;
  normalized._db=original._db;
  normalized._createdBy=original._createdBy;
  normalized._createdAt=original._createdAt;
  normalized._lockedAfter=original._lockedAfter;
  state.reports[ix]=normalized;
  return normalized;
}

async function saveReportAsDraft(rid){
  const r=getR(rid);if(!r)return;
  r.status='draft';

  try{

}

async function archiveReportVersion(rid){
  let r=getR(rid);if(!r)return;
  r.status='final';r.provisional=false;r.finalizedAt=new Date().toISOString();
  r.finalRecap=recapText(rid);
  // V31 : un ancien rapport local peut ne pas encore avoir d'UUID Supabase.
  // Dans ce cas csUpdateReport/csForceUpload... sortaient silencieusement et aucun média n'était envoyé.
  // On crée d'abord réellement le rapport dans Supabase, ce qui rebinde aussi les IDs médias Android.
  if(!r._db || !isDbUuid(r.id)){
    try{
      r=await csInsertReport(r);
    }catch(e){
      console.warn("Création Supabase avant upload",e);
      try{csShowUploadDiagnostic("ERREUR SAUVEGARDE SUPABASE\n"+(e?.message||e));}catch(_){}
      toast("Impossible de sauvegarder dans Supabase : "+(e?.message||e));
      return;
    }
  }else{
    await csUpdateReport(r);
  }
  await csForceUploadAllCategoryMedia(r);
  state.reportHistory=state.reportHistory||[];
  const snapshot=JSON.parse(JSON.stringify(r));snapshot.historyId=r.id;snapshot.savedAt=new Date().toISOString();snapshot.savedDate=r.verificationDate||r.date||new Date().toISOString().slice(0,10);
  const ix=state.reportHistory.findIndex(x=>x.historyId===r.id);if(ix>=0)state.reportHistory[ix]=snapshot;else state.reportHistory.unshift(snapshot);
  saveLocalOnly();setSaveStatus('Vérification enregistrée',true);toast('Vérification enregistrée. Tu peux continuer ou revenir quand tu veux.');
}

  autosaveReportNow(rid);

function editReport(rid){
  enterReportFieldMode();
  try{
    const previousScroll=window.scrollY||0;
    if(state.activeReportId)rememberReportPosition(state.activeReportId);

    state.activeReportId=rid;
    saveLocalOnly();
    setSaveStatus("Enregistrement automatique actif",true);

    const r=getR(rid);
    if(!r)throw new Error("Rapport introuvable");

    // V45 : la gouvernante du contrôle en cours vient toujours du compte connecté.
    // admin reste le login technique mais doit être affiché comme Amel dans le rapport.
    const autoGov=connectedGovernanteName();
    if(autoGov && r.agent!==autoGov){
      r.agent=autoGov;
      try{saveLocalOnly();}catch(e){}
      if(r._db){
        try{autosaveReportNow(rid);}catch(e){}
      }
    }

    const a=state.apartments.find(x=>x.id===r.aptId);
    if(!a)throw new Error("Logement introuvable");

    document.getElementById("view").innerHTML=reportHTML(r,a);

    // Si une catégorie était ouverte, elle reste ouverte après toute mise à jour.
    restoreOpenCategory(rid);

    // Ne jamais remonter en haut automatiquement pendant la saisie.
    const target=reportUiState.scrollByReport[rid];
    const y=Number.isFinite(target)?target:previousScroll;
    requestAnimationFrame(()=>window.scrollTo({top:y,behavior:"auto"}));
  }catch(e){
    console.error("Ouverture rapport",e);
    toast("Impossible d’ouvrir le rapport : "+(e.message||e));
  }
}

function numOptions(current,min,max,step=1,label="Sélectionner"){
  let out=`<option value="">${label}</option>`;
  for(let v=min; v<=max+1e-9; v+=step){
    let val=(Math.round(v*10)/10).toString();
    out+=`<option value="${val}" ${String(current)===val?"selected":""}>${val}</option>`;
  }
  return out;
}
function dateOptions(current,daysBack=30,daysForward=365){
  let out=`<option value="">Sélectionner une date</option>`;
  const today=new Date();
  for(let i=-daysBack;i<=daysForward;i++){
    const d=new Date(today); d.setDate(today.getDate()+i);
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
    const val=`${y}-${m}-${day}`;
    const fr=`${day}/${m}/${y}`;
    out+=`<option value="${val}" ${String(current)===val?"selected":""}>${fr}</option>`;
  }
  return out;
}

function ensureEquipmentDefaults(r){
  const names=["Wi-Fi","Climatiseur","Ventilateur","Radiateur","Lit bébé"];
  r.cats["ÉQUIPEMENTS"]=r.cats["ÉQUIPEMENTS"]||[];

  // V35 : supprimer d'abord les doublons existants (y compris ceux relus avec text/item_text).
  const seen=new Set();
  r.cats["ÉQUIPEMENTS"]=r.cats["ÉQUIPEMENTS"].filter(x=>{
    const key=csLocalItemText(x).trim().toLowerCase();
    if(!key)return false;
    if(seen.has(key))return false;
    seen.add(key);
    if(names.some(n=>n.toLowerCase()===key))x.fixedEquipment=true;
    return true;
  });

  names.forEach(name=>{
    if(!r.cats["ÉQUIPEMENTS"].some(x=>csLocalItemText(x).toLowerCase()===name.toLowerCase())){
      r.cats["ÉQUIPEMENTS"].push({id:uid(),name,precision:"",sub:"",media:[],fixedEquipment:true,includeRecap:false});
    }
  });
}

function inlineAddItem(rid,ce,se){
  const y=window.scrollY||document.documentElement.scrollTop||document.body.scrollTop||0;
  reportUiState.scrollByReport[rid]=y;

  const c=decodeURIComponent(ce),sub=decodeURIComponent(se),r=getR(rid);
  const field=document.getElementById(`add_${rid}_${ce}_${se}`);
  const name=(field?.value||"").trim();
  if(!name){toast("Écris d’abord l’item");return}

  const item={id:uid(),name,precision:"",sub,media:[],includeRecap:(c==="ÉQUIPEMENTS")};

  // Le nouvel item reste toujours le premier de la liste.
  r.cats[c].unshift(item);

  const box=document.getElementById(`items_${rid}_${ce}_${se}`);
  if(box){
    const empty=box.querySelector(".empty");
    if(empty) empty.remove();
    box.insertAdjacentHTML("afterbegin",itemHTML(rid,c,sub,item));
  }

  // Vider la saisie sans redonner le focus : le clavier/focus ne doit plus
  // provoquer une remontée au logo.
  if(field) field.value="";

  const recap=document.getElementById("recap_"+rid);
  if(recap) recap.innerHTML=recapHTML(r);

  autosaveReportNow(rid);

  // Verrouiller la position après les mises à jour DOM/WebView.
  const restore=()=>{
    try{
      window.scrollTo(0,y);
      if(document.scrollingElement) document.scrollingElement.scrollTop=y;
      document.documentElement.scrollTop=y;
      document.body.scrollTop=y;
    }catch(e){}
  };
  restore();
  requestAnimationFrame(()=>{ restore(); requestAnimationFrame(restore); });
  setTimeout(restore,80);
  setTimeout(restore,250);
}

function fileToData(f,cb){if(!f)return;const rd=new FileReader();rd.onload=()=>cb(rd.result);rd.readAsDataURL(f)}
function attachItem(rid,ce,se,xi,type,file){

function attachMediaCombined(rid,ce,se,xi,files){
  if(!files || !files.length)return;
  const c=decodeURIComponent(ce),sub=decodeURIComponent(se),r=getR(rid);
  const x=(r.cats[c]||[]).find(y=>y.id===xi);
  if(!x)return;

  if(nativeAvailable()){
    const inputId=`media_${rid}_${x.id}`;
    let total=Array.from(files).length;
    try{ total=Math.max(total,Number(NativeShare.selectedCount(inputId)||0)); }catch(e){}
    const previous=Array.isArray(x.media)?x.media.filter(m=>m&&m.native):[];
    const current=Array.from(files);
    const start=Math.max(0,total-current.length);
    const rebuilt=[];
    for(let i=0;i<total;i++){
      const old=previous.find(m=>Number(m.nativeIndex)===i);
      const fresh=(i>=start)?current[i-start]:null;
      rebuilt.push({
        id:old?.id||uid(),
        type:fresh?((fresh.type&&fresh.type.startsWith("video/"))?"video":"image"):(old?.type||"image"),
        name:fresh?.name||old?.name||`Média ${i+1}`,
        native:true,nativeInputId:inputId,nativeIndex:i
      });
    }
    x.media=rebuilt;
    save();
    refreshOneItem(rid,c,sub,xi);

    // V24 : une sélection native doit déclencher la synchronisation du rapport.
    // En V23, la branche native quittait la fonction ici sans autosave :
    // l'URI restait disponible pour WhatsApp mais l'upload Supabase n'était jamais lancé.
    // Pour un rapport déjà synchronisé, autosaveReportNow() appelle csUpdateReport(),
    // qui appelle ensuite csUploadSelectedCategoryMedia().
    try{ autosaveReportNow(rid); }catch(e){ console.warn("Autosave média V24",e); }
    return;
  }

  if(!Array.isArray(x.media)){
    x.media=[];
    if(x.photo){x.media.push({id:uid(),type:"image",data:x.photo});delete x.photo}
    if(x.video){x.media.push({id:uid(),type:"video",data:x.video});delete x.video}
  }

  const list=[...files];
  let remaining=list.length;
  list.forEach(file=>{
    fileToData(file,d=>{
      x.media.push({
        id:uid(),
        type:(file.type&&file.type.startsWith("video/"))?"video":"image",
        data:d,
        name:file.name||""
      });
      remaining--;
      if(remaining===0){
        save();
        refreshOneItem(rid,c,sub,xi);
      }
    });
  });
}

function removeItemMedia(rid,ce,xi,mid){
  const c=decodeURIComponent(ce),r=getR(rid);
  const x=(r.cats[c]||[]).find(y=>y.id===xi);
  if(!x)return;
  const sub=x.sub||"";

  if(!Array.isArray(x.media)){
    x.media=[];
    if(x.photo){x.media.push({id:"oldp_"+x.id,type:"image",data:x.photo});delete x.photo}
    if(x.video){x.media.push({id:"oldv_"+x.id,type:"video",data:x.video});delete x.video}
  }

  const target=x.media.find(m=>String(m.id)===String(mid));
  if(target?.native && nativeAvailable()){
    try{NativeShare.removeSelected(target.nativeInputId||`media_${rid}_${x.id}`,Number(target.nativeIndex||0));}catch(e){}
    x.media=x.media.filter(m=>String(m.id)!==String(mid)).map((m,i)=>m.native?{...m,nativeIndex:i}:m);
  }else{
    x.media=x.media.filter(m=>String(m.id)!==String(mid));
  }
  save();
  refreshOneItem(rid,c,sub,xi);
}

function dataUrlToFile(dataUrl,name){
  try{
    const parts=dataUrl.split(",");
    const mime=(parts[0].match(/data:([^;]+)/)||[])[1]||"application/octet-stream";
    const bin=atob(parts[1]||"");
    const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    return new File([arr],name||("media_"+Date.now()),{type:mime});
  }catch(e){return null}
}

function itemMediaFiles(item,prefix){
  const out=[];
  const media=Array.isArray(item.media)?item.media:[];
  media.forEach((m,i)=>{
    if(!m?.data)return;
    const ext=m.type==="video"?"mp4":"jpg";
    const f=dataUrlToFile(m.data,(m.name||`${prefix}_${i+1}.${ext}`));
    if(f)out.push(f);
  });
  if(item.photo){
    const f=dataUrlToFile(item.photo,`${prefix}_photo.jpg`); if(f)out.push(f);
  }
  if(item.video){
    const f=dataUrlToFile(item.video,`${prefix}_video.mp4`); if(f)out.push(f);
  }
  return out;
}

function categoryMediaFiles(r,c){
  const files=[];
  (r.cats[c]||[]).forEach((item,i)=>files.push(...itemMediaFiles(item,`${c}_${i+1}`)));
  return files;
}

function requireHostedShare(){
  if(!isHostedSecurely()){
    toast("Pour envoyer les photos/vidéos, ouvre l’application depuis son adresse HTTPS, pas depuis le fichier téléchargé.");
    return false;
  }
  if(!navigator.share){

    return false;

function filesFromSection(titleText,multipleAllowed=true){
  const sections=Array.from(document.querySelectorAll(".section, .card, section, div"));
  const target=sections.find(sec=>{
    const txt=(sec.innerText||"").toUpperCase();
    return txt.includes(String(titleText).toUpperCase()) && sec.querySelector('input[type="file"]');
  });
  if(!target)return [];
  const inputs=Array.from(target.querySelectorAll('input[type="file"]'));
  for(const input of inputs){
    const files=Array.from(input.files||[]);
    if(files.length)return multipleAllowed?files:[files[0]];
  }
  return [];
}

async function shareTextAndFiles(text,files){
  files=(files||[]).filter(Boolean);

  if(!requireHostedShare())return false;

  if(files.length && navigator.canShare && !navigator.canShare({files})){
    toast("Android refuse ce lot de fichiers. Essaie avec moins de fichiers ou depuis Chrome.");
    return false;
  }

  try{
    const payload={text};
    if(files.length)payload.files=files;
    await navigator.share(payload);
    return true;
  }catch(e){
    if(e && e.name==="AbortError")return false;
    console.warn("Partage natif",e);
    toast("Le partage des fichiers a échoué. Aucun envoi texte seul n’a été effectué.");
    return false;
  }
}

    if(e && e.name==="AbortError")return false;

function cleanWA(v){
  return String(v??"")
    .replace(/\\n/g,"\n")
    .replace(/\r\n/g,"\n")
    .replace(/\r/g,"\n")
    .trim();
}
function reportName(r){return state.apartments.find(a=>a.id===r.aptId)?.name||""}
function catText(rid,ce){
  const r=getR(rid),c=decodeURIComponent(ce),arr=r.cats[c]||[];
  const out=[reportName(r),c];

  const pushItem=(x)=>{
    const name=cleanWA(csLocalItemText(x));
    const precision=cleanWA(x.precision);
    const line=precision?`${name} : ${precision}`:name;
    line.split("\n").filter(Boolean).forEach((part,i)=>{
      out.push((i===0?"- ":"  ")+part.trim());
    });
  };

  if(SUBS[c]){
    SUBS[c].forEach(s=>{
      const z=arr.filter(x=>x.sub===s);
      if(z.length){
        out.push("",s);
        z.slice().reverse().forEach(pushItem);
      }
    });
  }else{
    arr.slice().reverse().forEach(pushItem);
  }
  return out.join("\n");
}
function formatScore(v){
  if(v===null || v===undefined || v==="") return "";
  return String(v).replace(".",",")+" / 5";
}
function orderedEquipment(arr){
  const order=["Wi-Fi","Climatiseur","Ventilateur","Radiateur","Lit bébé"];
  return arr.slice().sort((a,b)=>{
    const ia=order.indexOf(a.name), ib=order.indexOf(b.name);
    const aa=ia===-1?999:ia, bb=ib===-1?999:ib;
    return aa-bb;
  });
}

function recapItemLine(c,x){
  const name=cleanWA(csLocalItemText(x));

}
function recapText(rid){
  const r=getR(rid),a=state.apartments.find(x=>x.id===r.aptId);
  const out=["Récap :",a?.name||""];

  const head=[
    ["Date d'arrivée",r.arrival],
    ["Nombre de personnes",r.pax],
    ["Nombre de nuitées",r.nights],
    ["Agent de ménage",r.cleaner],
    ["Date du ménage",r.cleaningDate],
    ["Note du ménage",formatScore(r.agentScore)],
    ["Appréciation ménage",r.quality],
    ["Observations ménage",r.cleaningObs],
    ["Vérification gouvernante",r.verificationDate],
    ["Nom de la gouvernante",r.agent]
  ];
  head.forEach(([k,v])=>{if(cleanWA(v))out.push(`${k} : ${cleanWA(v)}`)});

  const pushItem=(x)=>{
    const name=cleanWA(csLocalItemText(x));
    const precision=cleanWA(x.precision);
    const line=precision?`${name} : ${precision}`:name;
    line.split("\n").filter(Boolean).forEach((part,i)=>{
      out.push((i===0?"- ":"  ")+part.trim());
    });
  };

  CATS.forEach(c=>{
    let arr=r.cats[c]||[];
    if(c==="ÉQUIPEMENTS"){
      arr=arr.filter(x=>!!x.includeRecap || !!cleanWA(x.precision) || !(x.fixedEquipment));
      arr=orderedEquipment(arr);
    }
    if(!arr.length)return;

    out.push("",c);

    if(SUBS[c]){
      SUBS[c].forEach(s=>{
        const xs=arr.filter(x=>x.sub===s);
        if(xs.length){
          out.push(s);
          xs.slice().reverse().forEach(pushItem);
        }
      });
    }else{
      const displayItems=c==="ÉQUIPEMENTS"?arr:arr.slice().reverse();
      displayItems.forEach(pushItem);
    }
  });

  return out.join("\n");
}

  });

      const d=r.verificationDate||r.savedDate||r.date||"";

function filterHistory(){
  const d=(document.getElementById("hist_date")?.value||"").trim();

  let hist=state.reportHistory||[];

  if(d) hist=hist.filter(h=>(h.verificationDate||h.savedDate||h.date||"")===d);

  if(q){
    hist=hist.filter(h=>{
      const aptName=(h.aptName||h.apartment||h.apartmentName||"").toLowerCase();
      let resolved=aptName;
      if(!resolved && h.aptId){
        const a=(state.apartments||[]).find(x=>x.id===h.aptId);
        resolved=(a?.name||"").toLowerCase();
      }
      return resolved.includes(q);
    });
  }

  const box=document.getElementById("history_list");
  if(box) box.innerHTML=historyListHTML(hist);
}

  if(!end){
    document.getElementById("view").innerHTML=`<div class="card">
      <div class="titlebar"><h2>DÉBUT DE GESTION</h2><button class="small secondary" onclick="toggleStartApartmentPanel()">+ AJOUTER UN LOGEMENT</button></div>
      <div id="start_apartment_panel" style="display:none;margin-top:12px">
        <label>NOM / RÉFÉRENCE DU LOGEMENT</label>
        <input id="start_new_apt_name" placeholder="Ex. GT-43-SAINT-MAUR" oninput="startApartmentMatches()">
        <div id="start_apt_matches"></div>
        <button class="small" style="margin-top:10px" onclick="createApartmentFromStart()">CRÉER ET OUVRIR</button>
      </div>
    </div>`; return;
  }
  document.getElementById("view").innerHTML=`<div class="card">
    <div class="titlebar"><h2>FIN DE GESTION</h2></div>
    <label>RECHERCHER UN LOGEMENT</label>
    <input id="inv_end_search" placeholder="Nom ou partie du nom du logement" oninput="inventoryEndSearch()">
    <div id="inv_end_results"></div>
  </div>`;
}
function toggleStartApartmentPanel(){
  const p=document.getElementById("start_apartment_panel"); if(!p)return;
  p.style.display="block";
  setTimeout(()=>document.getElementById("start_new_apt_name")?.focus({preventScroll:true}),50);
}
function startApartmentMatches(){
  const q=String(document.getElementById("start_new_apt_name")?.value||"").trim().toLowerCase();
  const box=document.getElementById("start_apt_matches"); if(!box)return;
  if(!q){box.innerHTML="";return}
  const matches=(state.apartments||[]).filter(a=>String(a.name||a.ref||a.reference||"").toLowerCase().includes(q)).slice(0,8);
  box.innerHTML=matches.map(a=>`<div class="result" onclick="inventoryPage('${a.id}',false)" style="cursor:pointer"><b>${esc(a.name||a.ref||a.reference||"")}</b><button class="small" onclick="event.stopPropagation();inventoryPage('${a.id}',false)">OUVRIR</button></div>`).join("");
}
async function createApartmentFromStart(){
  const name=String(document.getElementById("start_new_apt_name")?.value||"").trim();
  if(!name){toast("Écris le nom du logement");return}
  let a={id:uid(),name,createdAt:new Date().toISOString()};
  try{
    const me=current();
    if(me?.supabaseId){
      const {data,error}=await csSupabase.from("apartments").insert({name,created_by:me.supabaseId}).select().single();
      if(!error&&data)a={...a,...data,id:data.id,name:data.name||name,_db:true};
    }
  }catch(e){}
  state.apartments=state.apartments||[]; state.apartments.unshift(a); ensureInventory(a.id);
  try{save()}catch(e){try{saveLocalOnly()}catch(_){}}
  inventoryPage(a.id,false);
}
function inventoryEndSearch(){
  const q=String(document.getElementById("inv_end_search")?.value||"").trim().toLowerCase();
  const box=document.getElementById("inv_end_results");
  if(!box)return;
  if(!q){box.innerHTML="";return}
  const matches=(state.apartments||[]).filter(a=>String(a.name||"").toLowerCase().includes(q)).slice(0,20);
  box.innerHTML=matches.length?matches.map(a=>`<div class="result" onclick="inventoryPage('${a.id}',true)" style="cursor:pointer"><b>${esc(a.name)}</b><button class="small" onclick="event.stopPropagation();inventoryPage('${a.id}',true)">OUVRIR</button></div>`).join(""):'<div class="empty">Aucun logement trouvé.</div>';
}
function addApartmentForInventory(){
  document.getElementById("view").innerHTML=`<div class="card">
    <div class="titlebar"><h2>AJOUTER UN LOGEMENT — DÉBUT DE GESTION</h2><button class="small secondary" onclick="inventorySelect(false)">RETOUR</button></div>
    <label>Nom du logement</label>
    <input id="inv_new_name" placeholder="Exemple : GT-43-STMAUR">
    <br><br>
    <button onclick="createApartmentForInventory()">CRÉER ET OUVRIR L’INVENTAIRE</button>
  </div>`;
}
function createApartmentForInventory(){
  const name=(document.getElementById("inv_new_name").value||"").trim();
  if(!name){toast("Indique le nom du logement");return}
  if(state.apartments.some(a=>a.name.toLowerCase()===name.toLowerCase())){
    toast("Ce logement existe déjà. Ouvre-le dans la liste.");
    return;
  }
  const a={
    id:uid(),
    name,
    ref:name,
    arrival:"",
    cleaning:""
  };
  state.apartments.unshift(a);
  state.inventories[a.id]={start:{},end:{},zones:[]};
  save();
  inventoryPage(a.id,false);
}
function inventoryPage(aid,end=false){
  let inv=state.inventories[aid]||{start:{},end:{},zones:[]};
  if(!inv.start)inv.start={};
  if(!inv.end)inv.end={};
  if(!Array.isArray(inv.zones))inv.zones=[];
  // Répare aussi les anciennes zones créées avant les modèles automatiques.
  inv.zones.forEach(z=>{
    if(!Array.isArray(z.items))z.items=[];
    if(z.items.length===0){
      let inferred=String(z.zoneType||"").toUpperCase();
      const nm=String(z.name||"").toUpperCase();
      if(!INV_ZONE_TEMPLATES[inferred] || inferred==="AUTRE"){
        if(nm.includes("CHAMBRE"))inferred="CHAMBRE";
        else if(nm.includes("SALLE DE BAIN")||nm.includes("SDB"))inferred="SALLE DE BAIN";
        else if(nm.includes("WC"))inferred="WC";
        else if(nm.includes("CUISINE"))inferred="CUISINE";
        else if(nm.includes("SALON"))inferred="SALON";
        else if(nm.includes("SUITE"))inferred="SUITE PARENTALE";
      }
      if(INV_ZONE_TEMPLATES[inferred] && inferred!=="AUTRE"){
        z.zoneType=inferred;
        z.items=[...INV_ZONE_TEMPLATES[inferred]];
      }
    }
  });
  state.inventories[aid]=inv;
  const type=end?"end":"start";
  const a=state.apartments.find(x=>x.id===aid);
  save();

  document.getElementById("view").innerHTML=`<div class="card">
    <div class="titlebar">
      <h2>${end?"FIN DE GESTION":"DÉBUT DE GESTION"}</h2>
      <button class="small secondary" onclick="openApt('${aid}')">RETOUR</button>
    </div>
    <div class="row" style="grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
      <button class="small" onclick="wa(inventoryMissingText('${aid}',${end}))">ENVOYER CE QUI MANQUE</button>
      <button class="small" onclick="wa(inventoryText('${aid}',${end}))">ENVOYER LA RÉCAP COMPLÈTE</button>
    </div>
    <div class="muted">${esc(a.name)}</div>
  </div>

  <div class="section">
    <div class="titlebar"><h2>PIÈCES / ZONES DU LOGEMENT</h2><button class="small secondary" onclick="addInventoryZone('${aid}',${end})">+ AJOUTER UNE PIÈCE / ZONE</button></div>
    <div class="muted">Ajoute autant de chambres, suites parentales, salles de bain, WC, cuisines ou autres zones que nécessaire.</div>
    ${inv.zones.length?inv.zones.map(z=>`<div class="result">
      <span><b>${esc(z.name)}</b><br><span class="muted">${esc(z.zoneType)}</span></span>
      <span class="item-actions"><button class="small ghost" onclick="renameInventoryZone('${aid}','${z.id}',${end})">Modifier</button><button class="small danger" onclick="deleteInventoryZone('${aid}','${z.id}',${end})">Supprimer</button></span>
    </div>`).join(""):'<div class="empty">Aucune pièce supplémentaire ajoutée.</div>'}
  </div>

  ${Object.entries(INV).map(([g,items])=>`<div class="section"><h2>${g}</h2>${items.map(item=>invLine(aid,type,g,item,inv[type][g+"|"+item])).join("")}</div>`).join("")}

  ${inv.zones.map(z=>dynamicZoneHTML(aid,type,z,inv[type],end)).join("")}

  <div class="section"><div class="titlebar"><h2>ITEMS PERSONNALISÉS GÉNÉRAUX</h2><button class="small secondary" onclick="addCustomInv('${aid}','${type}')">+ AJOUTER UN ITEM</button></div>${(inv[type].custom||[]).map(x=>`<div class="result"><span>${esc(x.name)} : ${esc(x.qty||"0")} OK${Number(x.missing||0)>0?` - manque ${esc(x.missing)}`:""}</span><span class="item-actions"><button class="small ghost" onclick="editCustomInv('${aid}','${type}','${x.id}')">Modifier</button><button class="small danger" onclick="delCustomInv('${aid}','${type}','${x.id}')">Supprimer</button></span></div>`).join("")||'<div class="empty">Aucun item personnalisé.</div>'}</div>

  ${end?`<div class="section"><h2>COMPARAISON DÉBUT / FIN</h2>${compareInv(aid)}</div>`:""}`;
}

function dynamicZoneHTML(aid,type,z,data,end){
  const items=Array.isArray(z.items)?z.items:[];
  return `<div class="section">
    <div class="titlebar">
      <h2>${esc(z.name)}</h2>
      <button class="small secondary" onclick="addItemToInventoryZone('${aid}','${z.id}',${end})">+ AJOUTER UN ITEM</button>
    </div>
    ${items.length?items.map(item=>{
      const key=`ZONE|${z.id}|${item}`;
      const missingKey=key+"|MANQUE";
      const obsKey=key+"|OBS";
      return `<div class="inventory-line">
        <div class="inventory-item-name">${esc(item)}</div>
        <div class="inventory-three">
          <div>
            <label>OK</label>
            <input type="number" min="0" value="${data[key]??""}" placeholder="00" onchange="setInv('${aid}','${type}','${encodeURIComponent(key)}',this.value)">
          </div>
          <div>
            <label>MANQUE</label>
            <input type="number" min="0" value="${data[missingKey]??""}" placeholder="00" onchange="setInv('${aid}','${type}','${encodeURIComponent(missingKey)}',this.value)">
          </div>
          <div>
            <label>OBSERVATION</label>
            <input type="text" value="${esc(data[obsKey]??"")}" placeholder="Observation" onchange="setInv('${aid}','${type}','${encodeURIComponent(obsKey)}',this.value)">
          </div>
        </div>
      </div>`;
    }).join(""):'<div class="empty">Aucun item dans cette zone.</div>'}
  </div>`;
}

function addInventoryZone(aid,end){
  const inv=state.inventories[aid]||{start:{},end:{},zones:[]};
  if(!Array.isArray(inv.zones))inv.zones=[];
  state.inventories[aid]=inv;

  const types=Object.keys(INV_ZONE_TEMPLATES);
  const answer=prompt(
    "Type de pièce / zone :\n"+
    types.map((x,i)=>`${i+1}. ${x}`).join("\n")+
    "\n\nTape le numéro ou le nom."
  );
  if(answer===null)return;

  let zoneType=answer.trim().toUpperCase();
  const num=parseInt(zoneType,10);
  if(!isNaN(num)&&types[num-1])zoneType=types[num-1];
  if(!INV_ZONE_TEMPLATES[zoneType])zoneType="AUTRE";

  const defaultName=zoneType==="AUTRE"?"Nouvelle zone":zoneType.charAt(0)+zoneType.slice(1).toLowerCase();
  const name=prompt("Nom à afficher :",defaultName);
  if(!name)return;

  inv.zones.push({
    id:uid(),
    zoneType,
    name:name.trim(),
    items:[...(INV_ZONE_TEMPLATES[zoneType]||[])]
  });
  save();
  inventoryPage(aid,end);
}

function renameInventoryZone(aid,zid,end){
  const inv=state.inventories[aid],z=(inv.zones||[]).find(x=>x.id===zid);
  if(!z)return;
  const n=prompt("Nom de la pièce / zone :",z.name);
  if(n===null||!n.trim())return;
  z.name=n.trim();
  save();
  inventoryPage(aid,end);
}

function deleteInventoryZone(aid,zid,end){
  const inv=state.inventories[aid];
  if(!confirm("Supprimer cette pièce / zone de l’inventaire ?"))return;
  inv.zones=(inv.zones||[]).filter(z=>z.id!==zid);
  for(const type of ["start","end"]){
    Object.keys(inv[type]||{}).forEach(k=>{
      if(k.startsWith(`ZONE|${zid}|`))delete inv[type][k];
    });
  }
  save();
  inventoryPage(aid,end);
}

function addItemToInventoryZone(aid,zid,end){
  const inv=state.inventories[aid],z=(inv.zones||[]).find(x=>x.id===zid);
  if(!z)return;
  const name=prompt("Nom du nouvel item :");
  if(!name||!name.trim())return;
  if(!z.items.includes(name.trim()))z.items.push(name.trim());
  save();
  inventoryPage(aid,end);
}

  const key=g+"|"+item;
  const data=state.inventories?.[aid]?.[type]||{};
  const missingKey=key+"|MANQUE";
  const obsKey=key+"|OBS";
  return `<div class="inventory-line">
    <div class="inventory-item-name">${esc(item)}</div>
    <div class="inventory-three">
      <div>
        <label>OK</label>
        <input type="number" min="0" value="${val??""}" placeholder="00" onchange="setInv('${aid}','${type}','${encodeURIComponent(key)}',this.value)">
      </div>
      <div>
        <label>MANQUE</label>
        <input type="number" min="0" value="${data[missingKey]??""}" placeholder="00" onchange="setInv('${aid}','${type}','${encodeURIComponent(missingKey)}',this.value)">
      </div>
      <div>
        <label>OBSERVATION</label>
        <input type="text" value="${esc(data[obsKey]??"")}" placeholder="Observation" onchange="setInv('${aid}','${type}','${encodeURIComponent(obsKey)}',this.value)">

function setInv(aid,type,k,v){state.inventories[aid][type][decodeURIComponent(k)]=v;save()}
function addCustomInv(aid,type){
  const n=prompt("Nom de l’item :");if(!n)return;
  const q=prompt("Quantité OK :","1")||"";
  const m=prompt("Quantité manquante :","0")||"0";
  const inv=state.inventories[aid][type];inv.custom=inv.custom||[];
  inv.custom.unshift({id:uid(),name:n,qty:q,missing:m});
  save();inventoryPage(aid,type==="end")
}
function editCustomInv(aid,type,xi){
  const x=(state.inventories[aid][type].custom||[]).find(v=>v.id===xi);if(!x)return;
  const n=prompt("Nom :",x.name);if(n===null)return;
  x.name=n;
  x.qty=prompt("Quantité OK :",x.qty??"")||"";
  x.missing=prompt("Quantité manquante :",x.missing??"0")||"0";
  save();inventoryPage(aid,type==="end")
}
function delCustomInv(aid,type,xi){state.inventories[aid][type].custom=(state.inventories[aid][type].custom||[]).filter(x=>x.id!==xi);save();inventoryPage(aid,type==="end")}

function invFmtQty(v){
  const n=Number(v||0);
  return String(isNaN(n)?0:n).padStart(2,"0");
}


function inventoryMissingText(aid,end=false){
  const inv=state.inventories[aid]||{start:{},end:{},zones:[]};
  const type=end?"end":"start";
  const data=inv[type]||{};
  const apt=state.apartments.find(x=>x.id===aid);
  const out=[
    apt?.name||"",
    end?"FIN DE GESTION - MANQUANTS":"DÉBUT DE GESTION - MANQUANTS",
    ""
  ];

  const addGroup=(title,entries)=>{
    if(entries.length){
      out.push(title);
      out.push(...entries);
      out.push("");
    }
  };

  Object.entries(INV).forEach(([group,items])=>{
    const block=[];
    items.forEach(item=>{
      const key=group+"|"+item;
      const missN=Number(data[key+"|MANQUE"]||0);
      const obs=String(data[key+"|OBS"]||"").trim();
      if(missN>0){
        let line=`- ${item} : manque ${invFmtQty(missN)}`;
        if(obs)line+=` - observation : ${cleanWA(obs)}`;
        block.push(line);
      }
    });
    addGroup(group,block);
  });

  (inv.zones||[]).forEach(z=>{
    const block=[];
    (z.items||[]).forEach(item=>{
      const key=`ZONE|${z.id}|${item}`;
      const missN=Number(data[key+"|MANQUE"]||0);
      const obs=String(data[key+"|OBS"]||"").trim();
      if(missN>0){
        let line=`- ${item} : manque ${invFmtQty(missN)}`;
        if(obs)line+=` - observation : ${cleanWA(obs)}`;
        block.push(line);
      }
    });
    addGroup(z.name||z.zoneType||"ZONE",block);
  });

  const custom=(data.custom||[]);
  const customBlock=[];
  custom.forEach(x=>{
    const missN=Number(x.missing||0);
    if(missN>0) customBlock.push(`- ${cleanWA(x.name)} : manque ${invFmtQty(missN)}`);
  });
  addGroup("ITEMS PERSONNALISÉS",customBlock);

  if(out.length<=3) out.push("Aucun élément manquant.");
  return out.join("\n").trim();
}

function inventoryText(aid,end=false){
  const inv=state.inventories[aid]||{start:{},end:{},zones:[]};
  const type=end?"end":"start";
  const data=inv[type]||{};
  const apt=state.apartments.find(x=>x.id===aid);
  const out=[
    apt?.name||"",
    end?"FIN DE GESTION":"DÉBUT DE GESTION",
    ""
  ];

  const pushLine=(label,key)=>{
    const ok=data[key];
    const missing=data[key+"|MANQUE"];
    const okN=Number(ok||0);
    const missN=Number(missing||0);
    if((ok===""||ok==null) && (missing===""||missing==null))return;
    let line=`- ${label} : ${invFmtQty(okN)} OK`;
    if(missN>0)line+=` - manque ${invFmtQty(missN)}`;
    out.push(line);
  };

  Object.entries(INV).forEach(([group,items])=>{
    const before=out.length;
    const block=[];
    items.forEach(item=>{
      const key=group+"|"+item;
      const ok=data[key], missing=data[key+"|MANQUE"], obs=String(data[key+"|OBS"]||"").trim();
      if((ok===""||ok==null) && (missing===""||missing==null) && !obs)return;
      const okN=Number(ok||0), missN=Number(missing||0);
      let line=`- ${item} : ${invFmtQty(okN)} OK`;
      if(missN>0)line+=` - manque ${invFmtQty(missN)}`;
      if(obs)line+=` - observation : ${cleanWA(obs)}`;
      block.push(line);
    });
    if(block.length){
      out.push(group);
      out.push(...block);
      out.push("");
    }
  });

  (inv.zones||[]).forEach(z=>{
    const block=[];
    (z.items||[]).forEach(item=>{
      const key=`ZONE|${z.id}|${item}`;
      const ok=data[key], missing=data[key+"|MANQUE"], obs=String(data[key+"|OBS"]||"").trim();
      if((ok===""||ok==null) && (missing===""||missing==null) && !obs)return;
      const okN=Number(ok||0), missN=Number(missing||0);
      let line=`- ${item} : ${invFmtQty(okN)} OK`;
      if(missN>0)line+=` - manque ${invFmtQty(missN)}`;
      if(obs)line+=` - observation : ${cleanWA(obs)}`;
      block.push(line);
    });
    if(block.length){
      out.push(z.name||z.zoneType||"ZONE");
      out.push(...block);
      out.push("");
    }
  });

  const custom=(data.custom||[]);
  if(custom.length){
    out.push("ITEMS PERSONNALISÉS");
    custom.forEach(x=>{
      const okN=Number(x.qty||0), missN=Number(x.missing||0);
      let line=`- ${cleanWA(x.name)} : ${invFmtQty(okN)} OK`;
      if(missN>0)line+=` - manque ${invFmtQty(missN)}`;
      out.push(line);
    });
    out.push("");
  }

  return out.join("\n").trim();
}

function compareInv(aid){
  const i=state.inventories[aid]||{start:{},end:{},zones:[]};
  const keys=[...new Set([...Object.keys(i.start||{}),...Object.keys(i.end||{})])].filter(k=>k!=="custom"&&!k.endsWith("|MANQUE")&&!k.endsWith("|OBS"));
  const out=keys.map(k=>{
    const a=Number(i.start[k]||0),b=Number(i.end[k]||0);
    const am=Number(i.start[k+"|MANQUE"]||0),bm=Number(i.end[k+"|MANQUE"]||0);
    if(a===b && am===bm)return"";
    let label=k;
    if(k.startsWith("ZONE|")){
      const parts=k.split("|"),z=(i.zones||[]).find(x=>x.id===parts[1]);
      label=(z?z.name:"Zone")+" — "+parts.slice(2).join("|");
    }
    return `<div class="result"><span><b>DIFFÉRENCE</b><br>${esc(label)} : début ${a} OK / manque ${am} → fin ${b} OK / manque ${bm}</span></div>`;
  }).join("");
  return out||"<div class='empty'>Aucune différence détectée.</div>";
}

function marLine(aid,g,it,x){
  return `<div class="item"><div class="row"><div><b>${esc(it)}</b><label>Observation</label><textarea class="marriott-observation-small" rows="2" onchange="setMI('${aid}','${encodeURIComponent(g)}','${encodeURIComponent(it)}','obs',this.value)">${esc(x.obs||"")}</textarea></div><div>${x.photo?`<img src="${x.photo}">`:""}</div></div><div class="item-actions"><button class="small ghost" onclick="editMObs('${aid}','${encodeURIComponent(g)}','${encodeURIComponent(it)}')">Modifier</button><button class="small danger" onclick="deleteMObs('${aid}','${encodeURIComponent(g)}','${encodeURIComponent(it)}')">Supprimer</button></div></div>`
}
function setM(a,k,v){state.marriott[a][k]=v;save()}
function setMI(a,g,i,k,v){const m=state.marriott[a],key=decodeURIComponent(g)+"|"+decodeURIComponent(i);m.items[key]=m.items[key]||{};m.items[key][k]=v;save()}
function setMPhoto(a,g,i,f){fileToData(f,d=>{const m=state.marriott[a],key=decodeURIComponent(g)+"|"+decodeURIComponent(i);m.items[key]=m.items[key]||{};m.items[key].photo=d;save();marriottPage(a)})}
function editMObs(a,g,i){const key=decodeURIComponent(g)+"|"+decodeURIComponent(i),m=state.marriott[a],x=m.items[key]||{};const v=prompt("Observation :",x.obs||"");if(v===null)return;m.items[key]=m.items[key]||{};m.items[key].obs=v;save();marriottPage(a)}
function deleteMObs(a,g,i){const key=decodeURIComponent(g)+"|"+decodeURIComponent(i),m=state.marriott[a];if(confirm("Supprimer observation et photo de cette ligne ?")){delete m.items[key];save();marriottPage(a)}}
function missText(aid){
  const m=state.marriott[aid]||{},lines=[];
  Object.entries(m.items||{}).forEach(([k,x])=>{
    const obs=cleanWA(x.obs);
    if(!obs || !/manqu|missing|absent|déficit|reste/i.test(obs))return;
    const item=k.includes("|")?k.split("|").slice(1).join(" — "):k;
    const firstLine=obs.split("\n")[0].trim();
    lines.push(`— ${item}${firstLine?` : ${firstLine}`:""}`);
  });
  return lines.length?lines.join("\n"):"Aucun manquant";
}
function mFullText(aid){
  const m=state.marriott[aid]||{},a=state.apartments.find(x=>x.id===aid);
  const out=[a?.name||"","FICHE MARRIOTT – RÉCAP COMPLÈTE"];

  Object.entries(MARRIOTT).forEach(([g,items])=>{
    out.push("",g);
    items.forEach(it=>{
      const x=m.items?.[g+"|"+it];
      const obs=cleanWA(x?.obs||"");
      out.push("— "+it+(obs?" : "+obs:""));
    });
  });

  return out.join("\n");
}

<script id="supabase-auth-script">

const CS_LOGIN_MAP_KEY = 'pcs_login_name_email_map_v1';

function readLoginMap(){
  try{return JSON.parse(localStorage.getItem(CS_LOGIN_MAP_KEY)||"{}")||{}}catch(e){return{}}
}
function writeLoginMap(map){
  try{localStorage.setItem(CS_LOGIN_MAP_KEY,JSON.stringify(map||{}))}catch(e){}

    if(role==="admin")return;
    const name=String(user?.user_metadata?.name||user?.user_metadata?.username||"").trim();

    if(name && email && !name.includes("@")){
      const map=readLoginMap();
      map[name.toLowerCase()]=email;
      writeLoginMap(map);
      localStorage.setItem(CS_LOGIN_ID_KEY,name);
    }
  }catch(e){}
}
function resolveLoginEmail(identifier){
  const id=String(identifier||"").trim();
  if(!id)return "";

  const map=readLoginMap();

function forceVisibleUser(){

async function csDoLogin(){
  csMsg.textContent='';
  let enteredId=String(csEmail.value||"").trim();

  // Never keep the admin email as visible USER.
  if(enteredId.toLowerCase()==="yacef4@hotmail.com"){
    enteredId="admin";
    csEmail.value="admin";
  }

  let email=resolveLoginEmail(enteredId);
  if(!email && enteredId && !enteredId.includes("@")){
    csMsg.textContent='Ce nom n’est pas encore mémorisé sur cet appareil. Pour la toute première connexion de cette gouvernante, utilise son e-mail une seule fois ; ensuite son nom sera enregistré comme USER.';
    return;
  }

  const password=csPassword.value;
  if(!email || !password){
    csMsg.textContent='Entre ton USER et ton mot de passe.';
    return;
  }

  csLoginBtn.disabled=true;
  csLoginBtn.textContent='CONNEXION...';
  const {data,error}=await csSupabase.auth.signInWithPassword({email,password});
  csLoginBtn.disabled=false;
  csLoginBtn.textContent='SE CONNECTER';

  if(error){
    csMsg.textContent='Connexion refusée : '+error.message;
    return;
  }

  const profiledUser=await csApplyProfileRole(data.user);
  const role=(profiledUser?.app_metadata?.role||'gouvernante').toLowerCase();

  if(role==='admin'){
    try{
      localStorage.setItem(CS_LOGIN_ID_KEY,'admin');
      if(profiledUser?.email)localStorage.setItem(CS_ADMIN_EMAIL_KEY,profiledUser.email);

    rememberGovernanteLogin(profiledUser);
    const nm=String(profiledUser?.user_metadata?.name||profiledUser?.user_metadata?.username||enteredId).trim();

function nativeShareInputs(inputIds,text,mime,label){
  if(!window.NativeShare) return false;
  try{
    NativeShare.share((inputIds||[]).filter(Boolean).join('|'), String(text||''), String(mime||'*/*'), String(label||'WhatsApp'));
    return true;
  }catch(e){ console.warn('NativeShare',e); return false; }
}

function nativeCategoryInputIds(rid, category){
  const r=getR(rid); if(!r) return [];
  const ids=[];
  (r.cats[category]||[]).forEach(x=>ids.push(`media_${rid}_${x.id}`));
  return ids;
}

const __pcs_old_shareCategory = shareCategory;
shareCategory = async function(rid,ce){
  const c=decodeURIComponent(ce), r=getR(rid), text=catText(rid,ce);
  if(window.NativeShare){
    const ids=nativeCategoryInputIds(rid,c);
    let mediaCount=0;
    try{
      ids.forEach(id=>{ mediaCount += Number(NativeShare.selectedCount(id)||0); });
    }catch(e){ console.warn('selectedCount',e); }

    // PHOTO / VIDÉO EST FACULTATIF : s'il n'y a aucun média, on envoie
    // directement le texte sans demander d'ajouter une photo.
    if(mediaCount===0 && typeof NativeShare.shareText==='function'){
      NativeShare.shareText(String(text||''), String(c||'WhatsApp'));
      return;
    }
    if(nativeShareInputs(ids,text,'*/*',c)) return;
  }
  return __pcs_old_shareCategory(rid,ce);
};

shareFinalPhotos = async function(rid){

  const text=[reportName(r),'ÉTAT FINAL',cleanWA(r.finalDesc||'')].filter(Boolean).join('\n');

  if(window.NativeShare && typeof NativeShare.shareFinalAlbum==='function'){
    NativeShare.shareFinalAlbum(inputId,String(text||''),'ÉTAT FINAL');
    return;
  }
  return __pcs_old_shareFinalPhotos(rid);
};

const __pcs_old_shareFinalVideo = shareFinalVideo;
shareFinalVideo = async function(rid){
  const r=getR(rid), text=[reportName(r),'VIDÉO FINALE'].join('\n');
  if(window.NativeShare && nativeShareInputs([`final_video_${rid}`],text,'video/*','VIDÉO FINALE')) return;
  return __pcs_old_shareFinalVideo(rid);
};

const __pcs_old_shareKeys = shareKeys;
shareKeys = async function(rid){
  const r=getR(rid), lines=[reportName(r),'CLÉS'];
  if((r.keys||'').trim()) lines.push('— '+String(r.keys).trim());
  if(window.NativeShare){
    const inputId=`keys_media_${rid}`;
    let n=0;
    try{ n=Number(NativeShare.selectedCount(inputId)||0); }catch(e){}
    if(n===0 && typeof NativeShare.shareText==='function'){
      NativeShare.shareText(lines.join('\n'),'CLÉS');
      return;
    }
    if(nativeShareInputs([inputId],lines.join('\n'),'*/*','CLÉS')) return;
  }
  return __pcs_old_shareKeys(rid);
};
